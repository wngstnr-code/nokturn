[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The clearing verifier takes eight calldata arguments, which overflows the stack
# without the IR pipeline. It also produces tighter loops, and verify gas is what
# sets the maximum economic batch size.
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
gas_reports = ["*"]
fs_permissions = [
  { access = "read", path = "../data" },
  # Fork tests and the demo harness read the block the whole team is synchronised
  # on, and the demo reads the accounts the backend funds. Both files are owned by
  # infra, so this is read only on purpose.
  { access = "read", path = "../infra" },
  # The deploy script records what it put on chain, one file per chain id so a
  # mainnet run cannot quietly overwrite a testnet rehearsal.
  { access = "read-write", path = "deployments" },
]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "v4-core/=lib/v4-core/src/",
]

[rpc_endpoints]
# drpc needs no DNS workaround from Indonesia, unlike the official endpoint, and it
# serves historical state. Measured 21 September 2026 at nine depths from head minus
# 300 down to block 920,694, which is 1 July 2026, so a pinned block number holds.
# See pertanyaan-terbuka.md and test/fixtures/ForkFixture.sol.
mainnet = "https://robinhood.drpc.org"

[profile.default.fuzz]
runs = 512
# Pinned so the committed gas snapshot is reproducible. Without a seed the mean
# gas of a fuzz test moves a few units every run, and a gate that fails on its
# own randomness teaches everyone to ignore it. The ci profile leaves the seed
# free on purpose, because that is the run whose job is to find new inputs.
seed = "0x4e6f6b7475726e"

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

# Halmos finds its test functions by reading the solidity AST out of the build
# artifacts, and the default profile does not emit it because doing so roughly
# doubles the size of out/. tools/halmos.sh selects this profile.
[profile.halmos]
ast = true
# Foundry rewrites `new Contract()` in a test into the deployCode cheat code so it
# can relink without recompiling. Halmos does not implement that cheat code, so a
# setUp that deploys anything fails before the first path. Turning the rewrite off
# costs a slower build and is what lets a proof reach a contract at all.
dynamic_test_linking = false

[profile.ci.fuzz]
runs = 4096

[profile.ci.invariant]
runs = 512
depth = 128

# Nightly, one runner per suite. Depth is what is being bought here rather than
# runs, because the bugs left in this protocol are shaped like sequences and not
# like single wrong values. The bond paid twice needed a cross, then a failed
# challenge, then an abort, on the same auction. See parameter.md section 13 for
# the measurement behind these two numbers.
[profile.deep.invariant]
runs = 2000
depth = 256

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
