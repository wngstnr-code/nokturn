name: contracts

on:
  push:
    branches: [main]
  schedule:
    # Nightly for the long invariant walk and the proofs, Sunday morning for
    # mutation testing. They are separate entries because the jobs below select
    # on which one fired, and a weekly job on a nightly cron would run seven
    # times for every result anyone reads.
    - cron: "0 3 * * *"
    - cron: "0 5 * * 0"
  pull_request:
    paths:
      - "contracts/**"
      - "packages/shared/**"
      - ".github/workflows/contracts.yml"

env:
  FOUNDRY_PROFILE: ci

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        # Pinned, because the gas snapshot is a committed number. The stable tag
        # moved from 1.7.0 to 1.8.3 and every AuctionHouse test read between 17 and
        # 160 percent more gas, which made the gate fail on days when nothing in
        # this repo had changed. Raising this pin and regenerating the snapshot go
        # in the same commit.
        with:
          version: v1.8.3
      - run: forge fmt --check
      - run: forge build --sizes
      # Fork tests need a live archive node and belong to the nightly job, where a
      # flaky endpoint cannot block a pull request.
      - run: forge test -vvv --no-match-path "test/fork/*"
      - name: coverage gate, 95 percent lines on core contracts
        run: |
          # --ir-minimum because coverage disables the IR pipeline, and the
          # clearing verifier needs it to compile at all. There is no "|| true"
          # here, because a coverage run that dies would leave an empty file that
          # the gate reads as nothing to complain about, which is the same failure
          # the storage layout gate already had once.
          forge coverage --ir-minimum --report summary --no-match-coverage "(test|script)" \
            --no-match-path "test/fork/*" | tee coverage.txt
          # The adapter reads live pool state, so it has no coverage without a fork.
          # It is skipped here by name and enforced in the nightly fork job, rather
          # than quietly dropped from the threshold.
          ./tools/coverage-gate.sh coverage.txt UniswapV3Adapter
      - name: gas snapshot is committed and current
        # Default profile on purpose. The ci profile runs more fuzz iterations, which
        # moves the mean gas and would make the snapshot fail for no real reason.
        # Fork tests are excluded for a stronger reason. Their gas depends on live
        # pool state, so a committed number for them can never stay true and the
        # gate would fail on days when nothing in this repo changed.
        # --force because the coverage step above compiles with --ir-minimum, which
        # turns the optimizer off. Without a rebuild forge sees an up to date cache
        # and measures the unoptimized artifacts, which read about 2.5 times the
        # committed gas on the short revert paths.
        run: FOUNDRY_PROFILE=default forge snapshot --check --force --no-match-path "test/fork/*"
      - name: storage layout is committed and current
        run: |
          ./tools/storage-layout.sh
          git diff --exit-code storage-layout.txt
      - name: shared abi is committed and current
        run: |
          ./tools/export-abi.sh
          git diff --exit-code ../packages/shared/abi

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        # Pinned, because the gas snapshot is a committed number. The stable tag
        # moved from 1.7.0 to 1.8.3 and every AuctionHouse test read between 17 and
        # 160 percent more gas, which made the gate fail on days when nothing in
        # this repo had changed. Raising this pin and regenerating the snapshot go
        # in the same commit.
        with:
          version: v1.8.3
      - name: slither, zero high findings
        uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/
          fail-on: high
          slither-args: --exclude-dependencies
      - name: aderyn, zero high findings
        run: |
          # The cyfrinup installer this used to call is gone and answered 404,
          # which bash then tried to run as a command. The release asset is pinned
          # for the same reason the toolchain is.
          curl -sL https://github.com/Cyfrin/aderyn/releases/download/aderyn-v0.6.8/aderyn-installer.sh | sh
          export PATH="$HOME/.cargo/bin:$PATH"
          aderyn contracts/ --output report.json
          python3 - <<'PY'
          import json, sys
          high = json.load(open("report.json")).get("high_issues", {}).get("issues", [])
          if high:
              print(f"{len(high)} high severity findings")
              for i in high:
                  print(" -", i.get("title"))
              sys.exit(1)
          print("zero high severity findings")
          PY

  invariant-deep:
    # Nightly, per rencana-uji.md section 9. Every pull request already runs these
    # same campaigns at 512 runs by 128 depth through the ci profile. This is the
    # long walk at 2000 by 256, which is where a sequence that needs twenty actions
    # in the right order finally shows up. parameter.md section 13 has the
    # measurement behind the two numbers.
    #
    # One runner per suite, because the auction suite runs a whole auction per
    # action and takes 109 of every 111 seconds on its own. Sharing a runner with
    # it would mean the other three wait for nothing.
    if: github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [SettlementInvariants, AuctionInvariants, MandateInvariants, SessionInvariants]
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - name: ${{ matrix.suite }}, the long run
        run: FOUNDRY_PROFILE=deep forge test --match-contract "${{ matrix.suite }}" -vv

  halmos:
    # Nightly, per rencana-uji.md section 9. What forge runs as bounded fuzz over
    # these same functions, halmos runs symbolically, so a pass here is a proof
    # over the whole stated range rather than over 512 draws from it.
    if: github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install halmos
        # Pinned for the same reason the toolchain is. A solver that changes
        # version changes which proofs close inside the timeout, and a gate that
        # goes red on somebody else's release is a gate people learn to ignore.
        run: pip install halmos==0.3.3
      - name: every clearing property is proved, not sampled
        run: ./tools/halmos.sh

  fork:
    # Nightly, per rencana-uji.md section 9. The zero difference test is what makes
    # the savings number mean anything, so a failure here is a release blocker even
    # though it does not gate a pull request.
    if: github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        # Pinned, because the gas snapshot is a committed number. The stable tag
        # moved from 1.7.0 to 1.8.3 and every AuctionHouse test read between 17 and
        # 160 percent more gas, which made the gate fail on days when nothing in
        # this repo had changed. Raising this pin and regenerating the snapshot go
        # in the same commit.
        with:
          version: v1.8.3
      - name: fork tests against mainnet 4663
        run: forge test --match-path "test/fork/*" -vv

      - name: coverage gate on the adapter, which only a fork can reach
        run: |
          forge coverage --ir-minimum --report summary --no-match-coverage "(test|script)" | tee coverage.txt
          ./tools/coverage-gate.sh coverage.txt

  mutation:
    # Weekly, per rencana-uji.md section 9. Coverage says the tests executed a
    # line. This says they would have noticed if the line had been wrong, which
    # is the only one of the two that is worth putting in a pitch.
    #
    # Settlement and SessionManager are the two the document names as core and
    # holds to 90 percent. Both sit at 100 over their scoring mutants today, so
    # the threshold is headroom rather than a target, and a survivor that turns
    # up here is either a missing test or an entry in tools/mutants-explained.txt
    # with a written reason.
    if: github.event.schedule == '0 5 * * 0'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - name: mutation score on the core contracts
        run: python3 tools/mutate.py src/Settlement.sol src/SessionManager.sol --threshold 90

  echidna:
    # Nightly, per rencana-uji.md section 9. Foundry drives these same invariants
    # on every pull request. This is the second engine on them, and it is a
    # different engine rather than a second opinion. It builds its values from a
    # dictionary mined out of the source, mutates whole call sequences rather than
    # single arguments, and shrinks differently.
    if: github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install crytic-compile
        # Echidna reads the project through crytic-compile, which shells out to
        # forge. Pinned for the same reason the toolchain is.
        run: pip install crytic-compile==0.3.7 slither-analyzer==0.11.4
      - name: install echidna
        # The release binary rather than a container, because the job already has
        # a pinned foundry on the runner and a container would carry its own.
        run: |
          curl -sL -o echidna.tar.gz \
            https://github.com/crytic/echidna/releases/download/v2.3.3/echidna-2.3.3-x86_64-linux.tar.gz
          tar -xzf echidna.tar.gz
          sudo mv echidna /usr/local/bin/echidna
          echidna --version
      - name: every invariant on the second engine
        run: ./tools/echidna.sh --format text
