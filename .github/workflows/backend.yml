name: backend

# Feature F32 in docs/rencana-backend.md. Owned by Dharu.
#
# Split the same way contracts.yml is. What needs no chain runs on every pull
# request, and what needs a live fork runs nightly, because a flaky endpoint
# must not be able to block a merge.

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 4 * * *"
  # The fork job by hand, from the Actions tab, so a new secret or a fix can be
  # checked without waiting for the nightly run.
  workflow_dispatch:
  pull_request:
    paths:
      - "api/**"
      - "solver/**"
      - "indexer/**"
      - "analytics/**"
      - "infra/**"
      - "packages/shared/**"
      - ".github/workflows/backend.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version comes from packageManager in package.json. Naming it here as
      # well makes action-setup v4 refuse to run.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --dir packages/shared
      - run: pnpm install --dir api
      - run: pnpm install --dir solver
      # Before the api compiles, because the receipt routes import indexer/src
      # and resolve pg from indexer's own node_modules.
      - run: pnpm install --dir indexer
      - name: shared types compile
        working-directory: packages/shared
        run: npx tsc --noEmit
      - name: api compiles against them
        working-directory: api
        run: npx tsc --noEmit
      # The backtest curve the netting screen draws. Fails when the data file
      # loses its BACKTEST label or drifts from the figures the pitch quotes.
      - name: api unit tests
        run: pnpm -C api test
      - name: solver compiles against them
        run: pnpm -C solver typecheck

      # Unit tests only. They need no chain, so they hold every pull request to
      # the clearing properties.
      - name: solver unit tests
        run: pnpm -C solver test
      - name: indexer compiles
        run: pnpm -C indexer typecheck
      # Synthetic logs encoded from the real abis against an in memory store.
      # No database and no chain.
      - name: indexer unit tests
        run: pnpm -C indexer test
      # The replay imports api and solver modules, so it compiles after both
      # are installed. Its unit tests read no fixture and touch no chain.
      - run: pnpm install --dir analytics
      - name: analytics compiles
        run: pnpm -C analytics typecheck
      - name: analytics unit tests
        run: pnpm -C analytics test

      # The api reads its abis out of packages/shared/abi at boot. A missing one
      # is a five hundred on every request that touches that contract, and it
      # would otherwise only show up when somebody ran the server.
      - name: every abi the api loads is present
        run: |
          missing=0
          for name in Settlement SessionManager PriceOracle UniswapV3Adapter \
                      SolverRegistry ISignatureTransfer IUiMultiplier; do
            if [ ! -f "packages/shared/abi/$name.json" ]; then
              echo "missing packages/shared/abi/$name.json"
              missing=1
            fi
          done
          [ "$missing" = "0" ] || { echo "run contracts/tools/export-abi.sh"; exit 1; }
          echo "all seven abis present"

  fork:
    runs-on: ubuntu-latest
    # A full run takes under 30 minutes. Without this a hang held the runner
    # for six hours on 1 October 2026 before GitHub cancelled it.
    timeout-minutes: 90
    # Nightly only. These need archive state of mainnet 4663. The public drpc
    # endpoint stopped serving anything but latest on 26 September 2026 (N13),
    # so the fork reads an archive RPC from the repository secret. GitHub masks
    # its value in the log, and the scripts print the host only.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      NOKTURN_RPC_MAINNET: ${{ secrets.NOKTURN_RPC_MAINNET }}
      NOKTURN_DATABASE_URL: postgres://nokturn:nokturn@127.0.0.1:5440/nokturn
    # The receipt routes read the indexer's tables, so the api collection needs
    # them. Same image and port as infra/docker-compose.yml.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nokturn
          POSTGRES_PASSWORD: nokturn
          POSTGRES_DB: nokturn
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U nokturn"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - name: the archive RPC secret is set
        run: |
          if [ -z "$NOKTURN_RPC_MAINNET" ]; then
            echo "::error::NOKTURN_RPC_MAINNET is not set. Add an archive RPC for chain 4663 under Settings, Secrets and variables, Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      # The version comes from packageManager in package.json. Naming it here as
      # well makes action-setup v4 refuse to run.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --dir infra
      - run: pnpm install --dir api
      - run: pnpm install --dir indexer

      # The committed pin, the block every laptop forks. A fresh pin each night
      # put the fork in whatever session the clock happened to show, and the
      # resilience collection and the session checks are written for the team's
      # block. The archive RPC still serves it, which D1 measures every run.
      #
      # One retry on a fresh anvil, because an upstream read can time out mid
      # deploy, as on 1 October 2026. Deploying again on the same anvil would
      # move the nonces and with them every contract address.
      - name: start the fork, deploy and fund
        run: |
          start_and_deploy() {
            ./infra/scripts/fork.sh > /tmp/anvil.log 2>&1 &
            echo $! > /tmp/anvil.pid
            for _ in $(seq 1 60); do
              cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1 && break
              sleep 1
            done
            cast chain-id --rpc-url http://127.0.0.1:8545 && ./infra/scripts/deploy.sh && ./infra/scripts/fund.sh
          }
          if ! start_and_deploy; then
            echo "::warning::fork or deploy failed once, retrying on a fresh anvil"
            tail -20 /tmp/anvil.log || true
            kill "$(cat /tmp/anvil.pid)" 2>/dev/null || true
            pkill -x anvil 2>/dev/null || true
            sleep 3
            start_and_deploy
          fi

      - name: the batchId helper agrees with the contract, both directions
        run: ./infra/scripts/check-batch.sh

      - name: the witness digest is the one permit2 verifies
        run: ./infra/scripts/check-permit2.sh

      # Before the durability suite, so D4 and D5 load and cross a session
      # boundary with the api in front of the node, as in a demo, rather than
      # skipping their api half.
      - name: index to head and start the api
        run: |
          ./infra/scripts/prewarm.sh
          node indexer/src/index.ts --until-block "$(cast block-number --rpc-url http://127.0.0.1:8545)"
          (cd api && node src/index.ts > /tmp/api.log 2>&1 &)
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/v1/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/v1/health

      # Carries D7 and D8, which are the cross team checks. D7 catches
      # packages/shared/addresses.ts drifting from Addresses.sol, D8 catches a
      # committed abi no longer matching the bytecode it claims to describe.
      - name: the fork durability suite
        run: ./infra/scripts/check-fork.sh

      - name: the api answers on every route it claims
        run: |
          ./infra/scripts/postman.sh
          pnpm dlx newman run infra/postman/nokturn-fork.postman_collection.json \
            -e infra/postman/nokturn-local.postman_environment.json \
            --reporters cli --reporter-cli-no-banner
          pnpm dlx newman run infra/postman/nokturn-api.postman_collection.json \
            --reporters cli --reporter-cli-no-banner
          pnpm dlx newman run infra/postman/nokturn-resilience.postman_collection.json \
            --reporters cli --reporter-cli-no-banner

      - name: what the node said, when something above failed
        if: failure()
        run: |
          tail -50 /tmp/anvil.log || true
          tail -50 /tmp/api.log || true
