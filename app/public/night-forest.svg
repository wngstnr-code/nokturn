<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 400" fill="none">
  <style>
    .lid { transform-box: fill-box; transform-origin: center top; transform: scaleY(0); animation: blink 7s infinite; }
    .fly { animation: glow 4s ease-in-out infinite; }
    .fly:nth-of-type(2n) { animation-delay: 1.3s; }
    .fly:nth-of-type(3n) { animation-delay: 2.6s; }
    @keyframes blink { 0%, 94%, 100% { transform: scaleY(0); } 96%, 98% { transform: scaleY(1); } }
    @keyframes glow { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.9; } }
    @media (prefers-reduced-motion: reduce) { .lid, .fly { animation: none; } .fly { opacity: 0.7; } }
  </style>
